[package]
name = "hash-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8"
crc32fast = "1.5"
digest = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
tempfile = "3"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
serde_json = "1"
