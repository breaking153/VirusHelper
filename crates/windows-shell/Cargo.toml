[package]
name = "windows-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "virushelper_shell"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
hash-core = { path = "../hash-core" }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
