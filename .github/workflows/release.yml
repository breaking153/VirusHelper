name: Publish signed desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify tag and version numbers
        run: node scripts/prepare-release.mjs verify "$RELEASE_TAG"
      - name: Verify release assembly tests
        run: node --test scripts/prepare-release.test.mjs

  package:
    needs: verify
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            target: x86_64-pc-windows-msvc
            cli_sha256: 563cb2aef280c393688cebaff1a9fd4a2f6df4fdb9be2c665ff3c798a4ffe7c2
            bundles: nsis
          - os: macos-15
            name: macOS-arm64
            target: aarch64-apple-darwin
            cli_sha256: 35e3b339bfb5f2061023bf5646dc969e5fa53b6fc4347daf467e7f6743692494
            bundles: app
          - os: macos-15-intel
            name: macOS-x64
            target: x86_64-apple-darwin
            cli_sha256: 333987e244ef46152c107d3e922313fd09cfd8e43cd851512609c2264348fc9b
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node node_modules/prettier/bin/prettier.cjs --check src vite.config.ts index.html "*.json" ".github/workflows/*.yml" "src-tauri/*.json" "src-tauri/capabilities/*.json"
      - run: node node_modules/vitest/vitest.mjs run
      - run: node --test scripts/prepare-release.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - run: cargo test --manifest-path xtask/Cargo.toml --locked
      - run: cargo clippy --manifest-path xtask/Cargo.toml --locked -- -D warnings
      - name: Prepare Windows COM DLL before native checks
        if: runner.os == 'Windows'
        run: cargo xtask prepare-windows-shell
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bun audit --audit-level=high
      - name: Install verified official Rust Tauri CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $asset = 'cargo-tauri-${{ matrix.target }}.zip'
          gh release download tauri-cli-v2.12.3 --repo tauri-apps/tauri --pattern $asset --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official Tauri CLI.' }
          $archive = Join-Path $tools $asset
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne '${{ matrix.cli_sha256 }}') { throw 'Tauri CLI SHA-256 mismatch.' }
          Expand-Archive -Path $archive -DestinationPath (Join-Path $tools 'unpacked')
          $binary = if ('${{ runner.os }}' -eq 'Windows') { 'cargo-tauri.exe' } else { 'cargo-tauri' }
          $bin = Join-Path $tools 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Move-Item (Join-Path $tools "unpacked/$binary") (Join-Path $bin $binary)
          if ('${{ runner.os }}' -ne 'Windows') { chmod +x (Join-Path $bin $binary) }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $bin $binary) --version
      - name: Build and sign application and installer with Cargo
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key in repository Secrets'; exit 1; }
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            cargo xtask package-macos --target ${{ matrix.target }}
          else
            cargo xtask package-windows --target ${{ matrix.target }}
          fi
      - name: Verify Windows installer and automatic Shell registration
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installers = @(Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -Installer $installers[0].FullName -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: virushelper-release-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/pkg/*.pkg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    concurrency:
      group: publish-stable-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: virushelper-release-*
          path: release-artifacts
      - name: Assemble complete signed update manifest
        run: node scripts/prepare-release.mjs prepare "$RELEASE_TAG" release-artifacts release-assets
      - name: Publish only after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            node -e 'if (!require("./existing-release.json").isDraft) throw Error("This version is already published; publish a new version instead")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "VirusHelper $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName,isLatest --jq 'map(select(.isLatest)) | first | .tagName // ""' > latest-tag.txt
          make_latest=$(node scripts/prepare-release.mjs latest "$RELEASE_TAG" "$(cat latest-tag.txt)")
          gh release edit "$RELEASE_TAG" --draft=false "--latest=$make_latest"
