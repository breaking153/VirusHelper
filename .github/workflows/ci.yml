name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node node_modules/vitest/vitest.mjs run
      - run: node --test scripts/prepare-release.test.mjs
      - run: node node_modules/prettier/bin/prettier.cjs --check src vite.config.ts index.html "*.json" ".github/workflows/*.yml" "src-tauri/*.json" "src-tauri/capabilities/*.json"
      - run: cargo xtask frontend
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - run: cargo test --manifest-path xtask/Cargo.toml --locked
      - run: cargo clippy --manifest-path xtask/Cargo.toml --locked -- -D warnings
      - name: Prepare Windows COM DLL before native checks
        if: runner.os == 'Windows'
        run: cargo xtask prepare-windows-shell
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bun audit --audit-level=high
