[package]
name = "virus-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Offline cross-platform file hashing and checksum verification"

[lib]
name = "virus_helper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hash-core = { path = "../crates/hash-core" }
vt-client = { path = "../crates/vt-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
zeroize = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
